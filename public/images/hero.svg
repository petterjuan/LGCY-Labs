<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  
  <!-- Background gradient -->
  <rect width="1200" height="420" fill="url(#g)"/>
  
  <!-- Main centered content -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <!-- Main title -->
    <text y="-80" font-family="Inter, sans-serif" font-size="48" font-weight="bold" fill="#fff">LGCY Labs</text>
    
    <!-- Subtitle -->
    <text y="-30" font-family="Inter, sans-serif" font-size="22" fill="#e6f0ff" opacity="0.9">Agentic reliability &amp; revenue AI</text>
  </g>
  
  <!-- Centered feature cards -->
  <g transform="translate(600, 300)" text-anchor="middle">
    <!-- Left feature card -->
    <g transform="translate(-200, 0)">
      <rect x="-140" y="-40" width="280" height="80" rx="12" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity="0.3" stroke-width="1"/>
      <text y="-15" font-family="Inter, sans-serif" font-size="18" fill="#c7d2fe" font-weight="600">Self-Healing Systems</text>
      <text y="10" font-family="Inter, sans-serif" font-size="14" fill="#e6f0ff" opacity="0.8">99.9% Uptime</text>
    </g>
    
    <!-- Right feature card -->
    <g transform="translate(200, 0)">
      <rect x="-140" y="-40" width="280" height="80" rx="12" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity="0.3" stroke-width="1"/>
      <text y="-15" font-family="Inter, sans-serif" font-size="18" fill="#c7d2fe" font-weight="600">Agentic Reliability Framework</text>
      <text y="10" font-family="Inter, sans-serif" font-size="14" fill="#e6f2ff" opacity="0.8">Revenue-Focused AI</text>
    </g>
  </g>
</svg>
